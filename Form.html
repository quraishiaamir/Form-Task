<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
     <h2>Sign Up Form Example</h2>

        <form>                                                                       
         <label for="fname">First name*:</label>                                           <!-- id= Connects the label -->
         <input style="margin-left: 97px;" type="text" id="fname" name="fname" ><br><br>

         <label for="lname">Last name*:</label>
         <input style="margin-left: 100px;" type="text" id="lname" name="lname"><br><br>

         <label for="Organization">Organization:</label>
         <input style="margin-left: 89px;"type="text" id="Organization" name="Organization" ><br><br>

         <label for="email">Email address*:</label>
         <input style="margin-left: 76px;"type="email" id="email" name="email"><br><br>

         <label for="tel">Work Phone:</label>
         <input style="margin-left: 95px;"type="tel" id="tel" name="tel" ><br><br>
  
         <label for="tel">Home Phone:</label>
         <input style="margin-left: 92px;"type="tel" id="tel" name="tel"><br><br>
  
         <label for="tel">Cell phone:</label>
         <input style="margin-left: 103px;"type="tel" id="tel" name="tel" ><br><br>
  
         <label for="fax">Fax:</label>
         <input style="margin-left: 149px;"type="fax" id="fax" name="fax"><br><br>
  
         <label for="address"> Address 1*:</label>
         <input style="margin-left: 100px;" type="address" id="address" name="address" ><br><br>
  
         <label for="address">Address 2:</label>
         <input style="margin-left: 107px;"type="address" id="address" name="address"><br><br>
  
         <label for="city">City*:</label>
         <input style="margin-left: 135px;"type="city" id="city" name="city" ><br><br>
  
         <label for="state">State/Province:</label>
         <input style="margin-left: 78px;"type="state" id="state" name="state"><br><br>
  
         <label for="zip">Zip/Postal code:</label>
         <input style="margin-left: 70px;" type="zip" id="zip" name="zip" ><br><br>
  
         <label for="country">Country*:</label>
         <input style="margin-left: 110px;"type="country" id="country" name="country"><br><br>
  
         <label for="-required feild">* -required field</label>
         <input style="margin-left: 70px;"type="submit" value="Submit">

        </form>
</body>
</html>
